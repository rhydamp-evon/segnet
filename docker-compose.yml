services:

  redis:
    container_name: atlentis-blue-sky-redis
    restart: always
    image: redis:latest
    volumes:
      - atlentis-blue-sky-redis-data:/data
    expose:
      - "6379"

  db:
    image: postgres:12.7
    restart: always
    env_file:
      - src/.env
    volumes:
      - atlentis-blue-sky-pgdata:/var/lib/postgresql/data/

  web:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: atlentis-blue-sky-backend
    image: atlentis-blue-sky-django
    depends_on:
      - redis
      - db
    links:
      - redis
      - db
    volumes:
        - ./src:/atlentis-blue-sky/
        - atlentis-blue-sky-static:/atlentis-blue-sky/static
        - atlentis-blue-sky-media:/atlentis-blue-sky/media
    command: bash -c "python manage.py collectstatic --no-input && python manage.py migrate && gunicorn --workers=3 atlentis_ml_api.wsgi -b 0.0.0.0:8000"

  celery:
    restart: always
    build:
      context: .
      dockerfile: src/Dockerfile
    image: atlentis-blue-sky-django
    container_name: atlentis-blue-sky-celery
    command: bash -c "REMAP_SIGTERM=SIGQUIT celery -A atlentis_ml_api worker --loglevel=INFO -n worker@atlentis_ml_api"
    environment:
      C_FORCE_ROOT : "true"
      REMAP_SIGTERM : "SIGQUIT"
    depends_on:
      - redis
      - db
    links:
      - redis
      - db
    volumes:
        - ./src:/atlentis-blue-sky/      

  object-editing-gpu-service:
    profiles:
      - object-editing
    build:
      context: .
      dockerfile: object_editing_inference/Dockerfile.cpu
    container_name: atlentis-object-editing-inference
    restart: unless-stopped
    env_file:
      - src/.env
    environment:
      ENABLE_LOCAL_DEMO: "true"
      MEDIA_ROOT: /data/media
      YOLO_MODEL: /data/models/yoloe-26n-seg.pt
      YOLO_MIN_SCORE: "0.25"
      MASK_MIN_COMPONENT_AREA: "24"
      ENABLE_FBA_REFINEMENT: "true"
      FBA_REFINEMENT_MODEL: /data/legacy-checkpoints/final_fba.pth
      FBA_EDGE_RADIUS: "8"
      FBA_MAX_SIZE: "768"
      FBA_MIN_IOU: "0.75"
    volumes:
      - atlentis-blue-sky-media:/data/media
      - atlentis-object-editing-hf-cache:/root/.cache/huggingface
      - atlentis-object-editing-models:/data/models
      - atlentis-object-editing-torch-cache:/root/.cache/torch
      - ./src/checkpoints:/data/legacy-checkpoints:ro
    ports:
      - "8001:80"

  nginx:
    restart: always
    container_name: atlentis-blue-sky-nginx
    image: atlentis-blue-sky-nginx
    build: ./nginx/
    volumes:
      - ./nginx/:/etc/nginx/conf.d
      - ./logs/:/atlentis-blue-sky/logs
      - atlentis-blue-sky-static:/atlentis-blue-sky/static
      - atlentis-blue-sky-media:/atlentis-blue-sky/media
    ports:
      - 8080:80
    links:
      - web
    depends_on:
      - web

volumes:
  atlentis-blue-sky-redis-data:
  atlentis-blue-sky-static:
  atlentis-blue-sky-media:
  atlentis-blue-sky-pgdata:
  atlentis-object-editing-hf-cache:
  atlentis-object-editing-models:
  atlentis-object-editing-torch-cache:
